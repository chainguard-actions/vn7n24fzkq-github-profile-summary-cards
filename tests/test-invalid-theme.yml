name: Test invalid THEME fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Clean output dir
        run: rm -rf "$GITHUB_WORKSPACE/profile-summary-card-output"
      - id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: octocat
          THEME: definitely_not_a_theme
          AUTO_PUSH: 'false'
      - name: Assert action failed and generated nothing
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for invalid THEME"
            exit 1
          fi
          if [ -e "$GITHUB_WORKSPACE/profile-summary-card-output" ]; then
            echo "FAIL: output dir should not be created when validation fails"
            exit 1
          fi
          echo "PASS"
