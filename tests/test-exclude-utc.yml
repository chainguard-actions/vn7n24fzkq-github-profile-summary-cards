name: Test exclude and UTC offset inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          USERNAME: 'vn7n24fzkq'
          AUTO_PUSH: false
          EXCLUDE: 'HTML,CSS'
          UTC_OFFSET: '8'
      - name: Assert action ran with exclude and UTC offset inputs (succeeded or failed gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with EXCLUDE=HTML,CSS and UTC_OFFSET=8"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected under sentinel repo / API limits)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
