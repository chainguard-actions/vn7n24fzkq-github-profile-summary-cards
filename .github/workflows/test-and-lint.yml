name: Test and Lint

on:
  push:
    branches-ignore: [ release ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
    - name: Collect Workflow Telemetry
      uses: catchpoint/foresight-workflow-kit-action@105a1f2f6eef7e4403adf5592020391ebfc72583 # v1
      if: success() || failure()
      with:
        api_key: ${{ secrets.foresight_api_key }}

    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    - name: Use Node.js 20
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version-file: '.node-version'
        cache: 'npm'
    - run: npm install
    - run: npm run test

    - name: Analyze Test and/or Coverage Results
      uses: catchpoint/foresight-test-kit-action@16fcb107ba3a54b63d784ebcc4829b80e0ab79c3 # v1
      if: success() || failure()
      with:
        api_key: ${{ secrets.foresight_api_key }}
        test_format: JUNIT
        test_framework: JEST
        test_path: ./junit.xml
        coverage_format: JACOCO/XML
        coverage_path: ./coverage

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    - name: Use Node.js 20
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version-file: '.node-version'
        cache: 'npm'
    - run: npm install
    - run: npm run lint
